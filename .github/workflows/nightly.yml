on:
  push:
    branches: [main]
  workflow_dispatch:

name: Nightly

concurrency:
  group: nightly-main
  cancel-in-progress: true

jobs:
  nightly:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: experimental-features = nix-command flakes

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        run: bash .github/install-nix.sh

      - name: nix shell
        run: nix develop -L --verbose

      - name: resolve nightly version
        id: version
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          DATE_UTC="$(date -u +%Y%m%d)"

          TAG="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$TAG" ]; then
            VERSION="0.0.0"
            BASE=0
            OFFSET="${GITHUB_RUN_NUMBER:-1}"
          else
            VERSION="${TAG#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Latest stable tag '$TAG' is not vMAJOR.MINOR.PATCH"
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            BASE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            OFFSET="$(git rev-list "${TAG}..HEAD" --count)"
            if [ "$OFFSET" -lt 1 ]; then
              OFFSET=1
            fi
          fi
          if [ "$OFFSET" -gt 999 ]; then
            echo "::warning::More than 999 commits since ${TAG:-start}; clamping nightly offset to 999"
            OFFSET=999
          fi

          VERSION_CODE=$((BASE * 1000 + OFFSET))
          VERSION_NAME="${VERSION}-nightly.${DATE_UTC}+${SHORT_SHA}"
          {
            echo "short_sha=${SHORT_SHA}"
            echo "date_utc=${DATE_UTC}"
            echo "base_version=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "version_name=${VERSION_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Nightly version: ${VERSION_NAME} (code=${VERSION_CODE}, base=${VERSION}, offset=${OFFSET})"

      - name: build chuchu_jni
        run: |
          nix develop -c bash -c '
            set -e
            cd zig-src
            zig build -Doptimize=ReleaseSmall -Dtarget=aarch64-linux-android.24 jni
          '

      - name: build android release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_ABI_FILTERS: arm64-v8a
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f android/app/key.jks' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          nix develop -c bash -c '
            set -euo pipefail
            cd android
            chmod +x ./gradlew
            if [ -f local.properties ]; then chmod -w local.properties; fi
            ./gradlew testDebugUnitTest lintDebug assembleRelease
          '

      - name: name APK artifact
        id: apk
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(./android/app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo '::error::Expected exactly one nightly APK'
            exit 1
          fi
          SRC="${apks[0]}"
          DEST="./android/app/build/outputs/apk/release/chuchu-nightly.apk"
          cp "$SRC" "$DEST"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"

      - name: build release notes
        id: notes
        env:
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          {
            echo "### Chuchu nightly"
            echo
            echo "Automated build from \`main\` (\`${SHORT_SHA}\`)."
            echo
            echo "- **versionName:** \`${VERSION_NAME}\`"
            echo "- **versionCode:** \`${VERSION_CODE}\`"
            echo "- **commit:** https://github.com/${REPOSITORY}/commit/${COMMIT_SHA}"
            echo
            echo "#### Recent commits"
            echo
            git log -n 15 --pretty=format:'- %s (%h)' --no-merges
            echo
          } > "$NOTES"
          echo "path=${NOTES}" >> "$GITHUB_OUTPUT"

      - name: retarget rolling nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          DATE_UTC: ${{ steps.version.outputs.date_utc }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          TITLE="Nightly $DATE_UTC ($SHORT_SHA)"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "$TITLE" --notes-file "$NOTES_PATH" \
              --prerelease --latest=false --target "$GITHUB_SHA"
            gh release upload nightly "$APK_PATH" --clobber
          else
            gh release create nightly "$APK_PATH" --verify-tag --title "$TITLE" \
              --notes-file "$NOTES_PATH" --prerelease --latest=false \
              --target "$GITHUB_SHA"
          fi
